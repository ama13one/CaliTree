
name: Build SkillMotion 3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -type f -iname '*.zip' \
            -not -path './.git/*' \
            -not -path './extracted/*' \
            | sort | tail -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP file found in the repository."
            exit 1
          fi

          echo "Selected ZIP: $ZIP_FILE"
          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

          echo "Files found in ZIP:"
          find extracted -maxdepth 5 -type f | head -200

          WRAPPER="$(find extracted -type f -name gradlew \
            -not -path '*/.git/*' | head -n 1 || true)"

          if [ -n "$WRAPPER" ]; then
            PROJECT_DIR="$(dirname "$WRAPPER")"
          else
            SETTINGS="$(find extracted -type f \
              \( -name settings.gradle \
              -o -name settings.gradle.kts \) \
              | head -n 1 || true)"

            if [ -z "$SETTINGS" ]; then
              echo "::error::This ZIP is not a complete Android Gradle project."
              echo "No gradlew or settings.gradle(.kts) was found."
              echo "Upload the original Android project ZIP, not a source-only ZIP."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS")"
            echo "::warning::gradlew is missing; attempting to install Gradle."
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: ${{ hashFiles('extracted/**/gradlew') == '' }}
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install "platform-tools"
          "$SDKMANAGER" --install "platforms;android-35"
          "$SDKMANAGER" --install "build-tools;35.0.0"

      - name: Build APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          elif [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            gradle --no-daemon assembleDebug
          else
            echo "::error::Gradle project files are missing."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkillMotion-3D-APK
          path: |
            extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
