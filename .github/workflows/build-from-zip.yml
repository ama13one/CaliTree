
name: Build APK from CaliTree 3D ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "CaliTree-3D-v1.3.zip"
      - ".github/workflows/build-from-zip.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          echo "ANDROID SDK licenses step finished"

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract project ZIP
        shell: bash
        run: |
          test -f "CaliTree-3D-v1.3.zip"
          mkdir -p work
          unzip -q "CaliTree-3D-v1.3.zip" -d work

          SETTINGS="$(find work -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found in ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Fix app name and dependency
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])

          strings = root / "app/src/main/res/values/strings.xml"
          if not strings.exists():
              raise SystemExit(f"Missing file: {strings}")

          content = strings.read_text(encoding="utf-8")
          pattern = r'(<string\s+name="app_name"[^>]*>).*?(</string>)'

          updated, count = re.subn(
              pattern,
              lambda m: m.group(1) + "SkillMotion 3D" + m.group(2),
              content,
              count=1,
              flags=re.DOTALL,
          )

          if count == 0:
              raise SystemExit("Could not find app_name in strings.xml")

          strings.write_text(updated, encoding="utf-8")
          print("App display name changed to SkillMotion 3D")

          for gradle_file in root.rglob("*.gradle"):
              text = gradle_file.read_text(encoding="utf-8")
              text = text.replace(
                  "androidx.compose.ui.graphics:graphics",
                  "androidx.compose.ui:ui-graphics",
              )
              gradle_file.write_text(text, encoding="utf-8")

          for gradle_file in root.rglob("*.gradle.kts"):
              text = gradle_file.read_text(encoding="utf-8")
              text = text.replace(
                  "androidx.compose.ui.graphics:graphics",
                  "androidx.compose.ui:ui-graphics",
              )
              gradle_file.write_text(text, encoding="utf-8")

          print("Dependency check completed")
          PY

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleDebug

      - name: Find APK
        id: apk
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK_PATH="$(find app/build/outputs/apk/debug \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "APK generated: $APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkillMotion-3D-APK
          path: ${{ env.PROJECT_DIR }}/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
