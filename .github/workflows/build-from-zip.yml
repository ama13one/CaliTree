
name: Build APK from CaliTree 3D ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "CaliTree-3D-v1.3.zip"
      - ".github/workflows/build-from-zip.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager -print | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using: $SDKMANAGER"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -o pipefail
          yes | "$SDKMANAGER" --licenses || {
            echo "::error::Could not accept Android SDK licenses."
            exit 1
          }

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-34"
          "$SDKMANAGER" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          test -f "CaliTree-3D-v1.3.zip" || {
            echo "::error::ZIP file not found in repository root."
            exit 1
          }

          mkdir -p work
          unzip -q "CaliTree-3D-v1.3.zip" -d work

          SETTINGS="$(find work -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Android app Gradle file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Update app name and Compose dependency
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          strings = root / "app/src/main/res/values/strings.xml"

          if not strings.exists():
              raise SystemExit("strings.xml not found")

          content = strings.read_text(encoding="utf-8")
          pattern = r'(<string\s+name="app_name"[^>]*>).*?(</string>)'

          updated, count = re.subn(
              pattern,
              lambda m: m.group(1) + "SkillMotion 3D" + m.group(2),
              content,
              count=1,
              flags=re.DOTALL,
          )

          if count == 0:
              raise SystemExit("app_name not found in strings.xml")

          strings.write_text(updated, encoding="utf-8")

          for pattern in ("*.gradle", "*.gradle.kts"):
              for file in root.rglob(pattern):
                  if "build" in file.parts or ".gradle" in file.parts:
                      continue

                  text = file.read_text(encoding="utf-8")
                  fixed = text.replace(
                      "androidx.compose.ui.graphics:graphics",
                      "androidx.compose.ui:ui-graphics",
                  )

                  if fixed != text:
                      file.write_text(fixed, encoding="utf-8")
                      print(f"Fixed dependency in {file}")

          print("App display name set to SkillMotion 3D")
          PY

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$(find app/build/outputs/apk \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK was generated."
            exit 1
          fi

          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkillMotion-3D-APK
          path: ${{ env.PROJECT_DIR }}/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
          
