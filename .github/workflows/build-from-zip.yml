
name: Build SkillMotion 3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: findzip
        shell: bash
        run: |
          ZIP_FILE="$(find . -type f -name '*.zip' \
            -not -path './.git/*' \
            | sort | tail -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No project ZIP found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q "${{ steps.findzip.outputs.zip_file }}" \
            -d extracted

          find extracted -type f \
            \( -name gradlew \
            -o -name settings.gradle \
            -o -name settings.gradle.kts \)

      - name: Locate Gradle wrapper
        id: project
        shell: bash
        run: |
          WRAPPER="$(find extracted -type f \
            -name gradlew | sort | head -n 1)"

          if [ -z "$WRAPPER" ]; then
            echo "::error::gradlew not found in ZIP."
            echo "The ZIP must contain a complete Android project."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install "platform-tools"
          "$SDKMANAGER" --install "platforms;android-35"
          "$SDKMANAGER" --install "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkillMotion-3D-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
