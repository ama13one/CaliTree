
name: Build APK from CaliTree 3D ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "CaliTree-3D-v1.3.zip"
      - ".github/workflows/build-from-zip.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "CaliTree-3D-v1.3.zip" ]; then
            echo "::error::CaliTree-3D-v1.3.zip was not found."
            exit 1
          fi

          mkdir -p work
          unzip -q "CaliTree-3D-v1.3.zip" -d work

          SETTINGS="$(find work -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Gradle settings file not found in ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Android app Gradle file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Update app name and Compose dependency
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          strings = root / "app/src/main/res/values/strings.xml"

          if not strings.exists():
              raise SystemExit(f"strings.xml not found: {strings}")

          content = strings.read_text(encoding="utf-8")

          pattern = r'(<string\s+name="app_name"[^>]*>).*?(</string>)'

          updated, count = re.subn(
              pattern,
              lambda m: m.group(1) + "SkillMotion 3D" + m.group(2),
              content,
              count=1,
              flags=re.DOTALL,
          )

          if count == 0:
              raise SystemExit(
                  "app_name was not found. App name was not changed."
              )

          strings.write_text(updated, encoding="utf-8")
          print("App display name: SkillMotion 3D")

          for pattern in ("*.gradle", "*.gradle.kts"):
              for file in root.rglob(pattern):
                  if "build" in file.parts or ".gradle" in file.parts:
                      continue

                  text = file.read_text(encoding="utf-8")
                  fixed = text.replace(
                      "androidx.compose.ui.graphics:graphics",
                      "androidx.compose.ui:ui-graphics",
                  )

                  if fixed != text:
                      file.write_text(fixed, encoding="utf-8")
                      print(f"Fixed Compose dependency: {file}")
          PY

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          APK_PATH="$(find app/build/outputs/apk \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::Build completed but no APK was found."
            exit 1
          fi

          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkillMotion-3D-APK
          path: ${{ env.PROJECT_DIR }}/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
          
