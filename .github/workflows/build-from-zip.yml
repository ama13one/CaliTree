name: Build APK from CaliTree-3D Updated ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "CaliTree-3D-Updated.zip"
      - ".github/workflows/build-from-zip.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          if [ ! -f "CaliTree-3D-Updated.zip" ]; then
            echo "::error::CaliTree-3D-Updated.zip was not found in the repository root."
            exit 1
          fi

          echo "ZIP file found."
          ls -lh "CaliTree-3D-Updated.zip"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract project ZIP
        run: |
          rm -rf work
          mkdir -p work
          unzip -q "CaliTree-3D-Updated.zip" -d work

          echo "Extracted project structure:"
          find work -maxdepth 3 -type f | sort | head -300

      - name: Locate Android project
        id: project
        run: |
          PROJECT_DIR="$(find work -type f -name gradlew -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find work -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find work -type f -name settings.gradle -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Could not locate the Android Gradle project in the ZIP."
            echo "Check the extracted files and update the workflow if necessary."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project directory: $PROJECT_DIR"

      - name: Fix Compose dependency
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = "androidx.compose.ui.graphics:graphics"
          new = "androidx.compose.ui:ui-graphics"

          files = (
              list(Path(".").rglob("*.gradle"))
              + list(Path(".").rglob("*.gradle.kts"))
          )

          for file in files:
              if "build" in file.parts or ".gradle" in file.parts:
                  continue

              text = file.read_text(encoding="utf-8")
              if old in text:
                  file.write_text(
                      text.replace(old, new),
                      encoding="utf-8"
                  )
                  print(f"Fixed dependency in: {file}")
          PY

      - name: Check Gradle files
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          echo "Gradle files:"
          find . -maxdepth 4 \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -type f -print

          echo ""
          echo "Compose dependencies:"
          grep -R "androidx.compose" . \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --exclude-dir=build \
            --exclude-dir=.gradle || true

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Find APK
        run: |
          echo "APK files:"
          find "${{ steps.project.outputs.dir }}" \
            -type f -path "*/build/outputs/apk/*" -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CaliTree-3D-apk
          path: |
            ${{ steps.project.outputs.dir }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
