
name: Build SkillMotion 3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract SkillMotion 1.7 ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="SkillMotion-1.7.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Required file not found: $ZIP_FILE"
            echo "ZIP files available in repository:"
            find . -maxdepth 2 -type f -iname '*.zip' -print
            exit 1
          fi

          echo "Selected ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

          WRAPPER="$(find extracted -type f -name gradlew \
            -not -path '*/.git/*' | head -n 1 || true)"

          if [ -n "$WRAPPER" ]; then
            PROJECT_DIR="$(dirname "$WRAPPER")"
          else
            SETTINGS="$(find extracted -type f \
              \( -name settings.gradle \
              -o -name settings.gradle.kts \) \
              -not -path '*/.git/*' | head -n 1 || true)"

            if [ -z "$SETTINGS" ]; then
              echo "::error::No Gradle project found in SkillMotion-1.7.zip"
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS")"
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Fix Compose graphics dependency
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' FILE; do
            if grep -q 'androidx.compose.ui.graphics:graphics' "$FILE"; then
              sed -i \
                's/androidx\.compose\.ui\.graphics:graphics/androidx.compose.ui:ui-graphics/g' \
                "$FILE"
              echo "Fixed dependency in: $FILE"
            fi
          done < <(
            find . -type f \
              \( -name '*.gradle' \
              -o -name '*.gradle.kts' \
              -o -name '*.toml' \) \
              -print0
          )

          if grep -RIn \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.toml' \
            'androidx.compose.ui.graphics:graphics' .; then
            echo "::error::Incorrect Compose graphics dependency remains."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: ${{ hashFiles('extracted/**/gradlew') == '' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install "platform-tools"
          "$SDKMANAGER" --install "platforms;android-35"
          "$SDKMANAGER" --install "build-tools;35.0.0"

      - name: Build APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon clean assembleDebug
          else
            gradle --no-daemon clean assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkillMotion-1.7-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
