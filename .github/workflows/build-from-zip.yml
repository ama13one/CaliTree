
name: Build SkillMotion 3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: findzip
        shell: bash
        run: |
          ZIP_FILE="$(find . -type f -name '*.zip' \
            -not -path './.git/*' | sort | tail -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found in repository."
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q "${{ steps.findzip.outputs.zip_file }}" \
            -d extracted

          echo "Extracted project files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          GRADLE_FILE="$(find extracted -type f \
            \( -name gradlew -o -name settings.gradle \
            -o -name settings.gradle.kts \) \
            | sort | head -n 1)"

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Gradle project not found in ZIP."
            exit 1
          fi

          if [ "$(basename "$GRADLE_FILE")" = "gradlew" ]; then
            PROJECT_DIR="$(dirname "$GRADLE_FILE")"
          else
            PROJECT_DIR="$(dirname "$GRADLE_FILE")"
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          if [ ! -f gradlew ]; then
            echo "ERROR: Gradle wrapper is missing."
            exit 1
          fi

          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkillMotion-3D-APK
          path: |
            extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
