
name: Build APK from CaliTree 3D ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "CaliTree-3D-v1.3.zip"
      - ".github/workflows/build-from-zip.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          if [ ! -f "CaliTree-3D-v1.3.zip" ]; then
            echo "::error::CaliTree-3D-v1.3.zip not found."
            exit 1
          fi
          ls -lh "CaliTree-3D-v1.3.zip"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract project ZIP
        run: |
          rm -rf work
          mkdir -p work
          unzip -q "CaliTree-3D-v1.3.zip" -d work

          echo "Project files:"
          find work -maxdepth 3 -type f | sort | head -300

      - name: Locate Android project
        id: project
        run: |
          PROJECT_DIR="$(find work -type f \
            -name settings.gradle.kts -print -quit)"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find work -type f \
              -name settings.gradle -print -quit)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android Gradle project not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_DIR")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_DIR"

      - name: Rename app and fix Compose dependency
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # New display name shown on the Android launcher
          strings = Path("app/src/main/res/values/strings.xml")

          if not strings.exists():
              raise SystemExit("strings.xml not found")

          text = strings.read_text(encoding="utf-8")
          import re

          updated, count = re.subn(
              r'(<string\s+name="app_name"\s*>).*?(</string>)',
              r'\1SkillMotion 3D\2',
              text,
              count=1
          )

          if count == 0:
              raise SystemExit("app_name string not found")

          strings.write_text(updated, encoding="utf-8")
          print("App display name set to SkillMotion 3D")

          # Correct the Compose graphics dependency
          old = "androidx.compose.ui.graphics:graphics"
          new = "androidx.compose.ui:ui-graphics"

          for pattern in ("*.gradle", "*.gradle.kts"):
              for file in Path(".").rglob(pattern):
                  if "build" in file.parts or ".gradle" in file.parts:
                      continue

                  content = file.read_text(encoding="utf-8")
                  if old in content:
                      file.write_text(
                          content.replace(old, new),
                          encoding="utf-8"
                      )
                      print(f"Fixed dependency: {file}")
          PY

      - name: Verify project configuration
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          echo "App name:"
          grep 'name="app_name"' \
            app/src/main/res/values/strings.xml

          echo "Gradle configuration:"
          find . -maxdepth 2 \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -type f -print

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Find APK
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          APK="$(find . -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkillMotion-3D-APK
          path: ${{ steps.project.outputs.dir }}/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
          
