name: Build APK from CaliTree-3D ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "CaliTree-3D.zip"
      - ".github/workflows/build-from-zip.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract project ZIP
        run: |
          rm -rf work
          mkdir -p work
          unzip -q "CaliTree-3D.zip" -d work

      - name: Build APK
        working-directory: work/CaliTree
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"
        run: |
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "APK files:"
          find work/CaliTree -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CaliTree-3D-apk
          path: |
            work/CaliTree/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
