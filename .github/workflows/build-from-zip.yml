name: Build APK from CaliTree-3D ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "CaliTree-3D.zip"
      - ".github/workflows/build-from-zip.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Extract project ZIP
        run: |
          rm -rf work
          mkdir -p work
          unzip -q "CaliTree-3D.zip" -d work

          echo "Extracted files:"
          find work -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find work \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "APK files:"
          find "$PROJECT_DIR" -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CaliTree-3D-apk
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
